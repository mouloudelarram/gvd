# GVD Production Nginx Configuration
# Optimized for AWS EC2, VPS, and cloud deployments
# ====================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ========================================================================
    # LOGGING CONFIGURATION
    # ========================================================================
    
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    log_format gvd_api '$remote_addr - [$time_local] '
                       '"$request" $status $bytes_sent '
                       '$request_time $upstream_response_time';

    access_log /var/log/nginx/access.log main buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # ========================================================================
    # PERFORMANCE TUNING
    # ========================================================================
    
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    types_hash_max_size 2048;
    types_hash_bucket_size 64;
    server_tokens off;
    
    # Buffer sizes optimized for scanning reports
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # Proxy buffering for large responses
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # ========================================================================
    # GZIP COMPRESSION
    # ========================================================================
    
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/javascript application/json application/xml+rss 
               application/atom+xml image/svg+xml;
    gzip_min_length 1024;
    gzip_disable "msie6";

    # ========================================================================
    # RATE LIMITING ZONES
    # ========================================================================
    
    # Limit connections per IP
    limit_conn_zone $binary_remote_addr zone=addr:10m;
    
    # Limit requests per IP (general)
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    
    # Limit login attempts (stricter)
    limit_req_zone $binary_remote_addr zone=login:10m rate=2r/s;
    
    # Limit API endpoint (for scanning)
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    
    # Limit bulk scan operations
    limit_req_zone $binary_remote_addr zone=bulk:10m rate=5r/m;

    # ========================================================================
    # UPSTREAM CONFIGURATION
    # ========================================================================
    
    # Flask backend with multiple servers for scalability
    upstream gvd_backend {
        # Least connections load balancing strategy
        least_conn;
        
        # Main Flask backend
        server gvd-saas:5000 weight=1 max_fails=3 fail_timeout=30s;
        
        # Keepalive connections to backend
        keepalive 32;
    }

    # ========================================================================
    # HTTP REDIRECT (for ACME/Let's Encrypt & HTTP -> HTTPS)
    # ========================================================================
    
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Allow ACME Let's Encrypt verification
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ========================================================================
    # HTTPS SERVER (PRODUCTION)
    # ========================================================================
    
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        # ====================================================================
        # SSL/TLS CONFIGURATION
        # ====================================================================
        
        # SSL certificates (configure with certbot/Let's Encrypt)
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        
        # SSL protocols and ciphers
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        
        # HSTS (HTTP Strict Transport Security)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        
        # Certificate pinning (optional)
        # add_header Public-Key-Pins 'pin-sha256="..."; pin-sha256="..."; max-age=31536000; includeSubDomains' always;

        # ====================================================================
        # SECURITY HEADERS
        # ====================================================================
        
        # Prevent MIME type sniffing
        add_header X-Content-Type-Options "nosniff" always;
        
        # Clickjacking protection
        add_header X-Frame-Options "DENY" always;
        
        # XSS protection
        add_header X-XSS-Protection "1; mode=block" always;
        
        # Content Security Policy (adjust as needed for your app)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
        
        # Referrer policy
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        # Permissions policy
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # ====================================================================
        # STATIC ASSETS SERVING
        # ====================================================================
        
        # Serve static files directly from Nginx (very efficient)
        location /static/ {
            alias /app/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ====================================================================
        # HEALTH CHECK ENDPOINT
        # ====================================================================
        
        location /health {
            access_log off;
            proxy_pass http://gvd_backend;
            proxy_set_header Host $host;
        }

        # ====================================================================
        # LOGIN ENDPOINT (RATE LIMITED)
        # ====================================================================
        
        location ~* ^/(login|callback)$ {
            limit_req zone=login burst=5 nodelay;
            limit_conn addr 5;
            
            proxy_pass http://gvd_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_connection "";
        }

        # ====================================================================
        # SCAN ENDPOINTS (RATE LIMITED)
        # ====================================================================
        
        location /scan {
            limit_req zone=api burst=30 nodelay;
            limit_conn addr 10;
            
            proxy_pass http://gvd_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_connection "";
            
            # Larger timeout for scanning operations
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # ====================================================================
        # BULK SCAN ENDPOINTS (STRICT RATE LIMITING)
        # ====================================================================
        
        location /bulk-scan {
            limit_req zone=bulk burst=2 nodelay;
            limit_conn addr 3;
            
            proxy_pass http://gvd_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_connection "";
            
            # Very long timeout for bulk operations
            proxy_connect_timeout 10s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }

        # ====================================================================
        # REPORT DOWNLOAD ENDPOINTS
        # ====================================================================
        
        location ~* \.(pdf|json|md)$ {
            limit_req zone=general burst=50 nodelay;
            
            proxy_pass http://gvd_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_connection "";
            
            # Longer timeout for report generation
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # ====================================================================
        # API ENDPOINTS (RATE LIMITED)
        # ====================================================================
        
        location /api/ {
            limit_req zone=api burst=30 nodelay;
            limit_conn addr 10;
            
            proxy_pass http://gvd_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_http_version 1.1;
            proxy_connection "";
            
            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ====================================================================
        # MAIN APPLICATION (CATCH-ALL)
        # ====================================================================
        
        location / {
            limit_req zone=general burst=50 nodelay;
            limit_conn addr 10;
            
            proxy_pass http://gvd_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ====================================================================
        # DENY ACCESS TO SENSITIVE PATHS
        # ====================================================================
        
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # ========================================================================
    # HTTP/2 PUSH (Optional for static assets)
    # ========================================================================
    
    # Uncomment to enable HTTP/2 server push for critical assets
    # location / {
    #     http2_push_preload on;
    #     add_header Link "</static/css/base.css>; rel=preload; as=style" always;
    #     add_header Link "</static/js/base.js>; rel=preload; as=script" always;
    # }
}
