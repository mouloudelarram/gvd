[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gvd"
version = "0.1.0"
description = "Git Vulnerabilities Detector - Lightweight GitHub security scanning"
authors = [{name = "GVD Team"}]
dependencies = ["rich>=13.0.0", "reportlab>=4.0.0", "python-dateutil>=2.8.0"]
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
gvd = "cli:main"

[tool.setuptools.packages]
find = {where = ["."]}
