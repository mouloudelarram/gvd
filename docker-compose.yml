version: '3.8'

services:
  # SaaS Web Application
  gvd-saas:
    build:
      context: ./saas
      dockerfile: Dockerfile
    container_name: gvd-saas
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    env_file:
      - ./saas/.env
    volumes:
      - ./saas/scan_reports:/app/scan_reports
      - ./saas/repos:/app/repos
    depends_on:
      - gvd-cli
    restart: unless-stopped
    networks:
      - gvd-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/", "-m", "5"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  # CLI Scanner Service (builds the executable)
  gvd-cli:
    build:
      context: ./cli
      dockerfile: Dockerfile
    container_name: gvd-cli
    volumes:
      - gvd_reports:/app/reports
    environment:
      - PYTHONPATH=/app
    networks:
      - gvd-network
    entrypoint: echo "CLI service ready"

  # Optional: Nginx reverse proxy for production
  # Uncomment to enable
  # nginx:
  #   image: nginx:alpine
  #   container_name: gvd-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - gvd-saas
  #   restart: unless-stopped
  #   networks:
  #     - gvd-network

volumes:
  gvd_reports:
    driver: local

networks:
  gvd-network:
    driver: bridge

