[pytest]
# The globally-installed pytest-flask plugin is incompatible with Flask 3.x
# (imports the removed `_request_ctx_stack`). We do not use it, so disable it.
addopts = -p no:flask
testpaths = .
python_files = test_*.py
# Never collect from runtime artifact dirs (cloned repos, generated reports,
# the local sqlite dir) or the Node frontend-test project — otherwise a leftover
# clone containing its own `test_*.py` breaks collection.
norecursedirs = repos data scan_reports frontend-tests node_modules .git *.egg migrations
filterwarnings =
    ignore::DeprecationWarning


