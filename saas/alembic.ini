# Alembic configuration for the GVD SaaS service.
# The database URL is injected at runtime from DATABASE_URL (see db.run_migrations);
# the value below is only a placeholder default for direct `alembic` CLI use.

[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url = sqlite:///data/gvd.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
